"main":
  push:
    - name: build-and-test
      docker:
        image: mcr.microsoft.com/playwright:v1.62.1-noble
      stages:
        - name: install
          script: |
            npm ci
        - name: build
          script: |
            npm run build
        - name: test
          script: |
            npm run test
    # 云端 CI 冒烟（浏览器验收）：真实浏览器验证 + 方案库沉淀成长。
    # 推送到 main 后额外启动真实 Chromium 跑导航/断言/截图，失败即驱动 CI 红/绿；
    # 通过 --solution-repo 启用可成长方案库：错误二次触发推荐、未命中新错误记候选、
    # 报告注入已沉淀方案，供在线/本地 AI 决策引用。
    # 主干同样跑 DSH 双版本适配验收，防止「新版适配」在后续迭代里静默回归。
    - name: dsh-compat
      docker:
        image: node:22
      stages:
        - name: install
          script: |
            npm ci
        - name: build-plugin
          script: |
            npm run build:plugin
        - name: legacy-host
          script: |
            node scripts/dsh-compat-check.mjs legacy
        - name: modern-host
          script: |
            node scripts/dsh-compat-check.mjs modern
    - name: browser-smoke
      docker:
        image: mcr.microsoft.com/playwright:v1.62.1-noble
      stages:
        - name: install
          script: |
            npm ci
            npx playwright install chromium
        - name: build
          script: |
            npm run build
        - name: smoke
          script: |
            node packages/mcp-server/dist/cli.js --ci-spec ./examples/ci-spec.json --solution-repo ./solutions-repo.json
            # 失败返回非零退出码 → 驱动 CI 红/绿；报告已注入沉淀方案，可回写 PR 评论
  pull_request:
    - name: build-and-test
      docker:
        image: mcr.microsoft.com/playwright:v1.62.1-noble
      stages:
        - name: install
          script: |
            npm ci
        - name: build
          script: |
            npm run build
        - name: test
          script: |
            # 单测 + 真实浏览器验收（防止假装测试：
            # 必须真实控制浏览器并断言真实 DOM 状态）
            npm run test
    # DSH 双版本适配验收（ISSUE #33）：插件要能同时装在旧版（Code mode 线）
    # 与新版（PTC mode 线）DSH 上。这里在隔离临时目录各装一份真实宿主，
    # 用真 ToolRuntime 装配 lib/index.js 跑 15 枚工具的注册与 dispatch。
    - name: dsh-compat
      docker:
        image: node:22
      stages:
        - name: install
          script: |
            npm ci
        - name: build-plugin
          script: |
            npm run build:plugin
        - name: legacy-host
          script: |
            node scripts/dsh-compat-check.mjs legacy
        - name: modern-host
          script: |
            node scripts/dsh-compat-check.mjs modern
    - name: ai-code-review
      stages:
        - name: 代码评审
          image: cnbcool/code-review:latest
          settings:
            context: 10
            comment: true
            max_comments: 10
            min_severity: warning
            fail_on_critical: false
